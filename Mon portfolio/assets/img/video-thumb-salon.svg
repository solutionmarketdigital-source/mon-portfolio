<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960">
  <defs>
    <linearGradient id="vidSalonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#06121E"/>
    </linearGradient>
  </defs>

  <rect width="540" height="960" fill="url(#vidSalonBg)"/>

  <!-- Éléments scène conférence -->
  <polygon points="120,0 220,0 160,960 60,960" fill="#00D4FF" opacity="0.15"/>
  <polygon points="420,0 520,0 460,960 360,960" fill="#FFD000" opacity="0.15"/>

  <!-- Speaker sur scène stylisé -->
  <g transform="translate(270, 430)">
    <circle cx="0" cy="-60" r="45" fill="#FFD000"/>
    <path d="M-60 60 C-60 0 60 0 60 60 Z" fill="#FFFFFF"/>
    <!-- Micro cravate -->
    <circle cx="15" cy="10" r="6" fill="#06121E"/>
    <!-- Pupitre conférence -->
    <polygon points="-70,60 70,60 50,140 -50,140" fill="#081E33" stroke="#00D4FF" stroke-width="2"/>
    <text x="0" y="105" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" fill="#FFD000" text-anchor="middle">C3E / UAC</text>
  </g>

  <!-- Tag Titre -->
  <g transform="translate(270, 220)">
    <rect x="-180" y="-30" width="360" height="60" rx="30" fill="rgba(0,0,0,0.6)" stroke="#00D4FF" stroke-width="2"/>
    <text x="0" y="8" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">BEST-OF DES PITCHS 🚀</text>
  </g>

  <!-- Interface Reel -->
  <g transform="translate(480, 520)">
    <circle cx="0" cy="0" r="22" fill="rgba(0,0,0,0.5)"/>
    <path d="M0 8 L-6 2 C-9 -1 -9 -6 -5 -9 C-2 -11 0 -8 0 -8 C0 -8 2 -11 5 -9 C9 -6 9 -1 6 2 Z" fill="#FF4757" transform="scale(1.4) translate(-0, 2)"/>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">19.7K</text>

    <circle cx="0" cy="75" r="22" fill="rgba(0,0,0,0.5)"/>
    <circle cx="0" cy="75" r="10" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="107" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">910</text>

    <circle cx="0" cy="150" r="22" fill="rgba(0,0,0,0.5)"/>
    <path d="M-6 150 L6 142 L6 158 Z" fill="#FFFFFF"/>
    <text x="0" y="182" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">3.4K</text>
  </g>

  <!-- Bas du Reel -->
  <g transform="translate(30, 810)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">@c3e_uac_officiel</text>
    <text x="0" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="14" fill="#FFFFFF">3 minutes pour convaincre les investisseurs ! Voici le gagnant 🏆</text>
    <text x="0" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#00D4FF">🎵 Ambiance Inspiration &amp; Innovation</text>
  </g>

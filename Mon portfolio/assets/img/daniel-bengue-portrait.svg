<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A59"/>
      <stop offset="50%" stop-color="#E85A37"/>
      <stop offset="100%" stop-color="#A83216"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D5524"/>
      <stop offset="100%" stop-color="#5C3317"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2825"/>
      <stop offset="100%" stop-color="#181514"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0ECE8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arrière plan chaleureux avec motif abstrait créatif -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  <circle cx="680" cy="220" r="280" fill="#F5A623" opacity="0.35" filter="url(#glow)"/>
  <circle cx="120" cy="780" r="220" fill="#FFC107" opacity="0.25" filter="url(#glow)"/>
  
  <!-- Forme abstraite réseau / onde -->
  <path d="M-50 400 Q 200 300 400 500 T 850 420" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="10 10"/>
  <path d="M-50 480 Q 250 380 450 560 T 850 480" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Éléments tech / Social Media flottants -->
  <!-- Badge Instagram -->
  <g transform="translate(100, 180) rotate(-8)">
    <rect width="64" height="64" rx="18" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="12" y="12" width="40" height="40" rx="11" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="32" cy="32" r="10" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="43" cy="21" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Badge Like / Cœur -->
  <g transform="translate(620, 340) scale(1.1)">
    <circle cx="30" cy="30" r="28" fill="#FFFFFF" fill-opacity="0.9" filter="url(#glow)"/>
    <path d="M30 42 L21 33 C17 29 17 22 22 18 C26 15 30 19 30 19 C30 19 34 15 38 18 C43 22 43 29 39 33 Z" fill="#E85A37"/>
  </g>

  <!-- Silhouette & Portrait Stylisé Professionnel de Daniel Bengue -->
  <!-- Épaules & Veste -->
  <path d="M160 1000 L180 820 L270 690 L330 650 L400 700 L470 650 L530 690 L620 820 L640 1000 Z" fill="url(#jacketGrad)"/>
  
  <!-- Col chemise blanche -->
  <path d="M330 650 L400 770 L470 650 L425 640 L400 680 L375 640 Z" fill="url(#shirtGrad)"/>
  <!-- Cravate / col moderne décontracté -->
  <polygon points="390,680 410,680 405,820 395,820" fill="#E85A37"/>

  <!-- Cou -->
  <rect x="360" y="520" width="80" height="150" rx="20" fill="url(#skinGrad)"/>

  <!-- Tête et Visage -->
  <ellipse cx="400" cy="430" rx="125" ry="155" fill="url(#skinGrad)"/>

  <!-- Oreilles -->
  <ellipse cx="270" cy="440" rx="20" ry="32" fill="#5C3317"/>
  <ellipse cx="530" cy="440" rx="20" ry="32" fill="#5C3317"/>

  <!-- Cheveux courts dégradés soignés -->
  <path d="M280 380 Q 400 230 520 380 Q 525 310 400 270 Q 275 310 280 380 Z" fill="#151210"/>
  <path d="M280 380 C 270 330 330 290 400 290 C 470 290 530 330 520 380 C 510 320 460 305 400 305 C 340 305 290 320 280 380 Z" fill="#1C1816"/>

  <!-- Lunettes modernes élégantes -->
  <!-- Monture gauche -->
  <rect x="305" y="395" width="80" height="55" rx="14" fill="none" stroke="#2D2825" stroke-width="7"/>
  <!-- Monture droite -->
  <rect x="415" y="395" width="80" height="55" rx="14" fill="none" stroke="#2D2825" stroke-width="7"/>
  <!-- Pont et branches -->
  <line x1="385" y1="415" x2="415" y2="415" stroke="#2D2825" stroke-width="7"/>
  <line x1="285" y1="415" x2="305" y2="415" stroke="#2D2825" stroke-width="6"/>
  <line x1="495" y1="415" x2="515" y2="415" stroke="#2D2825" stroke-width="6"/>

  <!-- Yeux souriants & bienveillants derrière verres -->
  <ellipse cx="345" cy="420" rx="16" ry="10" fill="#FFFFFF"/>
  <circle cx="345" cy="420" r="7" fill="#1C1816"/>
  <circle cx="348" cy="417" r="2.5" fill="#FFFFFF"/>

  <ellipse cx="455" cy="420" rx="16" ry="10" fill="#FFFFFF"/>
  <circle cx="455" cy="420" r="7" fill="#1C1816"/>
  <circle cx="458" cy="417" r="2.5" fill="#FFFFFF"/>

  <!-- Sourcils expressifs -->
  <path d="M315 385 Q 345 375 375 385" stroke="#151210" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M425 385 Q 455 375 485 385" stroke="#151210" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Nez -->
  <path d="M400 425 Q 405 460 395 475 Q 405 480 415 475" stroke="#4A260F" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Sourire confiant et chaleureux -->
  <path d="M345 505 Q 400 555 455 505" fill="#FFFFFF"/>
  <path d="M345 505 Q 400 555 455 505" stroke="#3D1E0B" stroke-width="4" fill="none"/>
  <path d="M340 503 Q 400 565 460 503" stroke="#4A260F" stroke-width="3" fill="none"/>

  <!-- Barbe courte soignée (Goatee / Barbe de 3 jours) -->
  <path d="M360 535 Q 400 575 440 535 Q 430 580 400 585 Q 370 580 360 535 Z" fill="#181412" opacity="0.8"/>

  <!-- Badge officiel superposition bas droite -->
  <g transform="translate(480, 850)">
    <rect width="260" height="75" rx="38" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="40" cy="38" r="24" fill="#10B981"/>
    <path d="M31 38 L37 44 L49 32" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#1F1B18">Daniel Bengue</text>
    <text x="76" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#645C55">Freelance certifié</text>
  </g>
</svg>

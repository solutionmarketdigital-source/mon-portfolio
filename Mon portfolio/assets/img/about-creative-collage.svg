<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="abCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
    <linearGradient id="abCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2D3"/>
      <stop offset="100%" stop-color="#00A896"/>
    </linearGradient>
    <linearGradient id="abBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103FEF"/>
      <stop offset="100%" stop-color="#0B30BA"/>
    </linearGradient>
    <filter id="softSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.1" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Fond décoratif avec cercles colorés inspirés du template -->
  <circle cx="80" cy="220" r="30" fill="url(#abCoral)" opacity="0.8"/>
  <circle cx="480" cy="100" r="45" fill="url(#abCyan)" opacity="0.7"/>
  <circle cx="280" cy="440" r="25" fill="url(#abBlue)" opacity="0.85"/>
  <circle cx="520" cy="380" r="15" fill="#FFB142" opacity="0.9"/>

  <!-- Carte Principale Haute : Équipe & Stratégie Social Media -->
  <g transform="translate(150, 40)" filter="url(#softSh)">
    <rect width="320" height="200" rx="16" fill="#FFFFFF"/>
    <!-- Mockup d'interface de calendrier & Analytics -->
    <rect x="20" y="20" width="280" height="30" rx="8" fill="#F8F9FA"/>
    <circle cx="35" cy="35" r="5" fill="#FF5252"/>
    <circle cx="50" cy="35" r="5" fill="#FFB142"/>
    <circle cx="65" cy="35" r="5" fill="#00D2D3"/>
    <text x="90" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#636E72">Content Strategy Planner</text>

    <!-- Barres graphiques statistiques -->
    <rect x="25" y="70" width="270" height="18" rx="6" fill="#FFF0F0"/>
    <rect x="25" y="70" width="220" height="18" rx="6" fill="url(#abCoral)"/>
    <text x="25" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#2D3436">+240% Reach Instagram</text>

    <rect x="25" y="125" width="270" height="18" rx="6" fill="#E6FAF7"/>
    <rect x="25" y="125" width="190" height="18" rx="6" fill="url(#abCyan)"/>
    <text x="25" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#2D3436">+180K Vues TikTok / Reels</text>
  </g>

  <!-- Carte Secondaire Basse Gauche : Collaboration Asynchrone -->
  <g transform="translate(40, 200)" filter="url(#softSh)">
    <rect width="260" height="230" rx="16" fill="#FFFFFF"/>
    <rect x="20" y="20" width="220" height="120" rx="12" fill="#F4F8FD"/>
    <!-- Icône Laptop / Créativité -->
    <circle cx="130" cy="80" r="38" fill="url(#abBlue)"/>
    <path d="M118 80 L126 88 L142 72" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="130" y="165" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#1E272E" text-anchor="middle">Collaboration Fluide</text>
    <text x="130" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#718093" text-anchor="middle">Europe (GMT+1) &amp; Afrique</text>
  </g>

  <!-- Badge Flottant "Asynchrone Ready" -->
  <g transform="translate(320, 290)" filter="url(#softSh)">
    <rect width="230" height="90" rx="16" fill="#FFFFFF"/>
    <circle cx="45" cy="45" r="22" fill="#E8F8F5"/>
    <text x="45" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18" fill="#00D2D3" text-anchor="middle">⚡</text>
    <text x="80" y="38" font-family="'Outfit', sans-serif" font-weight="800" font-size="15" fill="#2D3436">Dispo Asynchrone</text>
    <text x="80" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#636E72">Notion, Slack &amp; Trello</text>
  </g>
</svg>

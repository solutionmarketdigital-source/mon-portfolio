<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="c3eBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="60%" stop-color="#06182B"/>
      <stop offset="100%" stop-color="#040E1A"/>
    </linearGradient>
    <linearGradient id="c3eGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>
    <linearGradient id="c3eBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#c3eBg)"/>

  <!-- Réseau de neurones / connexions business -->
  <g opacity="0.25">
    <circle cx="200" cy="200" r="4" fill="#00D4FF"/>
    <circle cx="600" cy="250" r="6" fill="#FFD000"/>
    <circle cx="350" cy="400" r="5" fill="#00D4FF"/>
    <circle cx="650" cy="500" r="4" fill="#FF8A00"/>
    <circle cx="150" cy="650" r="5" fill="#00D4FF"/>
    <line x1="200" y1="200" x2="350" y2="400" stroke="#00D4FF" stroke-width="1.5"/>
    <line x1="600" y1="250" x2="350" y2="400" stroke="#00D4FF" stroke-width="1.5"/>
    <line x1="600" y1="250" x2="650" y2="500" stroke="#FF8A00" stroke-width="1.5"/>
    <line x1="350" y1="400" x2="150" y2="650" stroke="#00D4FF" stroke-width="1.5"/>
  </g>

  <!-- En-tête institutionnel Université d'Abomey-Calavi & C3E -->
  <g transform="translate(400, 90)">
    <rect x="-240" y="-20" width="480" height="46" rx="23" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="0" y="9" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#00D4FF" text-anchor="middle" letter-spacing="3">UNIVERSITÉ D'ABOMEY-CALAVI • C3E</text>
  </g>

  <!-- Titre Officiel -->
  <text x="400" y="200" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">5ÈME ÉDITION NATIONALE</text>
  <text x="400" y="270" font-family="'Outfit', sans-serif" font-weight="900" font-size="52" fill="url(#c3eGold)" text-anchor="middle">SALON DE L'ENTREPRENEURIAT</text>
  <text x="400" y="325" font-family="'Outfit', sans-serif" font-weight="800" font-size="32" fill="#FFFFFF" text-anchor="middle">C3E / UAC</text>

  <!-- Thème de l'édition -->
  <g transform="translate(400, 395)">
    <rect x="-310" y="-25" width="620" height="50" rx="14" fill="rgba(0, 212, 255, 0.12)" stroke="#00D4FF" stroke-width="1"/>
    <text x="0" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">Thème : "Oser Entreprendre, Digitaliser &amp; Bâtir l'Avenir"</text>
  </g>

  <!-- 3 Piliers du Salon -->
  <g transform="translate(100, 480)">
    <!-- Pilier 1 -->
    <rect x="0" y="0" width="180" height="150" rx="16" fill="#0F2B48" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="90" cy="45" r="24" fill="url(#c3eBlue)"/>
    <text x="90" y="52" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">💡</text>
    <text x="90" y="95" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" text-anchor="middle">CONFÉRENCES</text>
    <text x="90" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#9FBAD4" text-anchor="middle">Keynotes &amp; Panels</text>

    <!-- Pilier 2 -->
    <rect x="210" y="0" width="180" height="150" rx="16" fill="#0F2B48" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="300" cy="45" r="24" fill="url(#c3eGold)"/>
    <text x="300" y="52" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" fill="#06182B" text-anchor="middle">🏆</text>
    <text x="300" y="95" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" text-anchor="middle">CONCOURS PITCH</text>
    <text x="300" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#9FBAD4" text-anchor="middle">Financements à la clé</text>

    <!-- Pilier 3 -->
    <rect x="420" y="0" width="180" height="150" rx="16" fill="#0F2B48" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="510" cy="45" r="24" fill="url(#c3eBlue)"/>
    <text x="510" y="52" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">🤝</text>
    <text x="510" y="95" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" text-anchor="middle">NETWORKING</text>
    <text x="510" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#9FBAD4" text-anchor="middle">Rencontres B2B</text>
  </g>

  <!-- Chiffres clés attendus -->
  <g transform="translate(100, 680)">
    <rect width="600" height="100" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="100" y="45" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="url(#c3eGold)" text-anchor="middle">+1 500</text>
    <text x="100" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#9FBAD4" text-anchor="middle">Participants</text>

    <text x="300" y="45" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="url(#c3eGold)" text-anchor="middle">25</text>
    <text x="300" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#9FBAD4" text-anchor="middle">Speakers experts</text>

    <text x="500" y="45" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="url(#c3eGold)" text-anchor="middle">50+</text>
    <text x="500" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#9FBAD4" text-anchor="middle">Stands exposants</text>
  </g>

  <!-- CTA Inscription -->
  <g transform="translate(400, 840)">
    <rect x="-180" y="0" width="360" height="65" rx="33" fill="url(#c3eGold)"/>
    <text x="0" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18" fill="#06182B" text-anchor="middle">S'inscrire gratuitement</text>
  </g>

  <text x="400" y="940" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#9FBAD4" text-anchor="middle">Amphithéâtre Idriss Déby Itno • Entrée libre sur inscription</text>
</svg>

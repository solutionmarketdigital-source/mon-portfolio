<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960">
  <defs>
    <linearGradient id="vidSenanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8008"/>
      <stop offset="50%" stop-color="#FFC837"/>
      <stop offset="100%" stop-color="#1E120B"/>
    </linearGradient>
  </defs>

  <rect width="540" height="960" fill="url(#vidSenanBg)"/>

  <!-- Cercles d'ambiance cuisine & feu de bois -->
  <circle cx="270" cy="450" r="220" fill="#FF8008" opacity="0.3"/>
  
  <!-- Assiette en gros plan -->
  <g transform="translate(270, 440)">
    <circle cx="0" cy="0" r="160" fill="#241B15" stroke="#FFC837" stroke-width="4"/>
    <ellipse cx="-20" cy="-10" rx="70" ry="50" fill="#FF8008" opacity="0.9"/>
    <ellipse cx="40" cy="30" rx="45" ry="20" fill="#FFD000" transform="rotate(30)"/>
    <ellipse cx="30" cy="55" rx="40" ry="18" fill="#FFB703" transform="rotate(25)"/>
    <!-- Flammes stylisées -->
    <path d="M-60 -80 Q -40 -130 -20 -90 Q 0 -140 20 -90 Q 40 -120 50 -80 Z" fill="#FFE600" opacity="0.8"/>
  </g>

  <!-- Tag Titre Recette -->
  <g transform="translate(270, 220)">
    <rect x="-160" y="-30" width="320" height="60" rx="30" fill="rgba(0,0,0,0.6)" stroke="#FFC837" stroke-width="2"/>
    <text x="0" y="8" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">SECRET DE BRAISAGE 🍗</text>
  </g>

  <!-- Interface Reel -->
  <g transform="translate(480, 520)">
    <circle cx="0" cy="0" r="22" fill="rgba(0,0,0,0.5)"/>
    <path d="M0 8 L-6 2 C-9 -1 -9 -6 -5 -9 C-2 -11 0 -8 0 -8 C0 -8 2 -11 5 -9 C9 -6 9 -1 6 2 Z" fill="#FF4757" transform="scale(1.4) translate(-0, 2)"/>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">28.9K</text>

    <circle cx="0" cy="75" r="22" fill="rgba(0,0,0,0.5)"/>
    <circle cx="0" cy="75" r="10" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="107" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">1.4K</text>

    <circle cx="0" cy="150" r="22" fill="rgba(0,0,0,0.5)"/>
    <path d="M-6 150 L6 142 L6 158 Z" fill="#FFFFFF"/>
    <text x="0" y="182" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">4.8K</text>
  </g>

  <!-- Bas du Reel -->
  <g transform="translate(30, 810)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">@senan_delices</text>
    <text x="0" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="14" fill="#FFFFFF">Notre marinade secrète prête en 24h 🔥 Tag un fan d'alloco !</text>
    <text x="0" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#FFC837">🎵 Musique d'ambiance Afrogroove — Sénan</text>
  </g>

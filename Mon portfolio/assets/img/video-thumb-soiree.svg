    <path d="M-6 150 L6 142 L6 158 Z" fill="#FFFFFF"/>
    <text x="0" y="182" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">8.9K</text>

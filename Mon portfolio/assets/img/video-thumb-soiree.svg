  </g>

  <!-- Interface Reel -->
  <g transform="translate(480, 520)">
    <circle cx="0" cy="0" r="22" fill="rgba(0,0,0,0.5)"/>
    <path d="M0 8 L-6 2 C-9 -1 -9 -6 -5 -9 C-2 -11 0 -8 0 -8 C0 -8 2 -11 5 -9 C9 -6 9 -1 6 2 Z" fill="#FF4757" transform="scale(1.4) translate(-0, 2)"/>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">52.4K</text>

    <circle cx="0" cy="75" r="22" fill="rgba(0,0,0,0.5)"/>
    <circle cx="0" cy="75" r="10" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="107" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">3.2K</text>


      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#FF0080"/>
      <stop offset="100%" stop-color="#0E051F"/>
    </linearGradient>
  </defs>

  <rect width="540" height="960" fill="url(#vidPartyBg)"/>

  <!-- Éclats stroboscopiques et lasers -->
  <line x1="0" y1="100" x2="540" y2="400" stroke="#00F2FE" stroke-width="4" opacity="0.6"/>
  <line x1="540" y1="80" x2="0" y2="450" stroke="#FFD600" stroke-width="3" opacity="0.6"/>
  <circle cx="270" cy="400" r="180" fill="#FF0080" opacity="0.35"/>

  <!-- Silhouette foule en transe & mains levées -->
  <path d="M0 720 Q 50 680 100 700 Q 150 650 200 690 Q 250 640 300 680 Q 350 660 400 700 Q 450 670 540 710 L540 960 L0 960 Z" fill="#0A0417"/>
  <!-- Mains levées en silhouette -->
  <path d="M120 720 L135 620 L150 720 Z" fill="#0A0417"/>
  <path d="M260 700 L275 590 L290 700 Z" fill="#0A0417"/>
  <path d="M410 710 L425 610 L440 710 Z" fill="#0A0417"/>

  <!-- Titre Teaser -->
  <g transform="translate(270, 240)">
